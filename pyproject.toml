[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svcsite"
version = "0.9.0"
description = "Agent-friendly Android syscall dynamic analysis CLI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "z9null" }
]
dependencies = []

[project.scripts]
svcsite = "svcsite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
